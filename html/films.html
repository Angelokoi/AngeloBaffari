<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✝︎ Angelo Baffari — Luces ✝︎</title>
  <link rel="icon" href="img/favicon.png" type="image/png" sizes="64x64">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      height: 100dvh;
      background: url('img/bgfilmslowres.png') center/cover no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    nav {
      position: sticky;
      top: 0;
      width: 100%;
      display: flex;
      gap: 20px;
      justify-content: center;
      padding: 15px 0;
      background: rgba(30,30,30,0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #444;
      z-index: 10;
    }
    nav a { color: #b8f2e6; text-decoration: none; font-weight: 500; transition: 0.3s ease; }
    nav a:hover { color: #ffadad; }
    .logo-ab { font-size: 1.3em; font-weight: bold; color: #eaeaea; }

    main { padding: 60px 40px; }
    h1 { font-size: 2.5em; margin-bottom: 10px; color: #fcd5ce; }
    p.subtitle { font-size: 1.2em; color: #ccc; margin-bottom: 40px; }

    .film-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .film {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      padding: 0;
      border-radius: 12px;
      border: 1px solid #444;
      background: #111;
      cursor: pointer;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .film:hover, .film:focus-visible { transform: scale(1.03); box-shadow: 0 0 12px rgba(255,173,173,0.2); outline: none; }
    .film img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.7); transition: filter 0.3s ease; }
    .film:hover img, .film:focus-visible img { filter: brightness(1); }
    .film-title {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      text-align: left;
      color: #fff;
      font-family: inherit;
      font-size: 1.5em;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    }
    /* Los dos más recientes, más grandes */
    .film-grid .film:nth-child(-n+2) { grid-column: span 2; grid-row: span 2; }
    .vacio { color: #ccc; }

    /* Visor de video */
    .visor {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(10,10,10,0.96);
      z-index: 1000;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .visor .marco { width: min(88vw, calc(70vh * 16 / 9)); aspect-ratio: 16 / 9; }
    .visor iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; transition: opacity 0.3s ease; }
    .visor p { color: #ccc; margin-top: 14px; font-size: 0.95em; text-align: center; padding: 0 20px; }
    .visor .cerrar { position: fixed; top: 20px; right: 30px; color: #ffc6c6; cursor: pointer; font-size: 1.2em; }
    .visor .flecha { position: fixed; top: 50%; transform: translateY(-50%); font-size: 2em; color: #ffc6c6; cursor: pointer; user-select: none; padding: 10px; }
    .visor .izq { left: 10px; }
    .visor .der { right: 10px; }

    .cruz {
      position: fixed;
      font-size: 1.5em;
      color: #ffadad;
      opacity: 0.7;
      animation: flotar 6s ease-in-out infinite;
      z-index: 5;
      pointer-events: none;
    }
    .cruz:nth-child(1) { top: 70px; left: 25px; animation-delay: 0s; }
    .cruz:nth-child(2) { top: 80px; right: 40px; animation-delay: 1s; }
    .cruz:nth-child(3) { bottom: 50px; left: 60px; animation-delay: 2s; }
    .cruz:nth-child(4) { bottom: 40px; right: 50px; animation-delay: 3s; }
    @keyframes flotar {
      0%,100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      50% { transform: translateY(-12px) rotate(6deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .cruz { animation: none; } }

    @media (max-width: 768px) {
      nav { flex-wrap: wrap; gap: 10px; padding: 10px 5px; }
      nav a { font-size: 0.9em; }
      main { padding: 25px 15px; }
      h1 { font-size: 1.8em; margin-bottom: 12px; }
      p.subtitle { font-size: 1em; margin-bottom: 15px; }
      .film-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
      .film-title { font-size: 1em; bottom: 8px; left: 8px; right: 8px; }
      .film-grid .film:nth-child(-n+2) { grid-column: span 1; grid-row: span 1; }
      .visor .marco { width: 94vw; }
      .cruz { font-size: 1.2em; }
    }
  </style>
</head>
<body>
  <div class="cruz">✝︎</div>
  <div class="cruz">✝︎</div>
  <div class="cruz">✝︎</div>
  <div class="cruz">✝︎</div>

  <nav>
    <a class="logo-ab">✝︎ ab</a>
    <a href="index.html">visiones</a>
    <a href="music.html">melodías</a>
    <a href="films.html" style="color: #ffadad;">luces</a>
    <a href="artes.html">artes</a>
    <a href="manifiesto.html">manifiesto</a>
  </nav>

  <main>
    <h1>luces</h1>
    <p class="subtitle">poemas en movimiento.</p>
    <div class="film-grid" id="grilla"></div>
  </main>

  <!-- Los videos se agregan en el archivo films.js -->
  <script src="films.js"></script>
  <script>
    // Saca el código del video de cualquier link de YouTube (watch, youtu.be, embed, con o sin lista)
    function ytId(u) {
      const m = (u || '').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    // Se muestran en el orden del archivo (el primero es el más nuevo).
    // Si TODOS los videos tienen "fecha", se ordenan solos por fecha.
    let lista = (typeof films !== 'undefined' ? films : []).filter(f => ytId(f.youtube));
    if (lista.length && lista.every(f => f.fecha)) {
      lista = lista.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
    }

    const grilla = document.getElementById('grilla');
    if (!lista.length) grilla.innerHTML = '<p class="vacio">todavía no hay videos...</p>';

    lista.forEach((f, i) => {
      const id = ytId(f.youtube);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'film';
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = f.titulo || 'video';
      const auto = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
      img.src = f.miniatura || auto;
      img.onerror = () => { if (img.src !== auto) img.src = auto; };  // si falla tu miniatura, usa la de YouTube
      const t = document.createElement('div');
      t.className = 'film-title';
      t.textContent = f.titulo || '';
      b.append(img, t);
      b.onclick = () => abrir(i);
      grilla.appendChild(b);
    });

    // Visor
    let ov = null, idx = 0, cerrado = true;
    function fuente(i) { return 'https://www.youtube.com/embed/' + ytId(lista[i].youtube) + '?autoplay=1&rel=0'; }
    function mostrar(cambiar) {
      const fr = ov.querySelector('iframe');
      const poner = () => {
        fr.src = fuente(idx);
        ov.querySelector('p').textContent = lista[idx].titulo || '';
        fr.style.opacity = 1;
      };
      if (cambiar) { fr.style.opacity = 0; setTimeout(poner, 200); } else poner();
    }
    function ir(d) { idx = (idx + d + lista.length) % lista.length; mostrar(true); }
    function cerrar() {
      if (cerrado) return;
      cerrado = true;
      window.removeEventListener('popstate', cerrar);
      const o = ov;
      o.style.opacity = 0;
      setTimeout(() => { o.remove(); document.body.style.overflow = ''; }, 300);
    }
    function pedirCierre() {
      if (history.state && history.state.visor) history.back(); else cerrar();
    }
    function abrir(i) {
      idx = i;
      cerrado = false;
      document.body.style.overflow = 'hidden';
      ov = document.createElement('div');
      ov.className = 'visor';
      ov.innerHTML = '<div class="cerrar">✝︎ cerrar ✝︎</div><div class="flecha izq">⟵</div><div class="flecha der">⟶</div>' +
        '<div class="marco"><iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video"></iframe></div><p></p>';
      ov.onclick = e => {
        if (e.target.classList.contains('izq')) ir(-1);
        else if (e.target.classList.contains('der')) ir(1);
        else if (e.target.classList.contains('cerrar') || e.target === ov) pedirCierre();
      };
      document.body.appendChild(ov);
      setTimeout(() => ov.style.opacity = 1, 20);
      mostrar(false);
      history.pushState({ visor: true }, '');
      window.addEventListener('popstate', cerrar);
    }
    document.addEventListener('keydown', e => {
      if (cerrado) return;
      if (e.key === 'Escape') pedirCierre();
      if (e.key === 'ArrowRight') ir(1);
      if (e.key === 'ArrowLeft') ir(-1);
    });
  </script>
</body>
</html>
