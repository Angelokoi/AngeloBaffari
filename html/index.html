<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✝︎ Angelo Baffari — Visiones ✝︎</title>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      height: 100dvh;
      background: url('img/bgphotolowres.png') center/cover no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    nav {
      position: sticky;
      top: 0;
      width: 100%;
      display: flex;
      gap: 20px;
      justify-content: center;
      padding: 15px 0;
      background: rgba(30, 30, 30, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #444;
      z-index: 10;
    }
    nav a { color: #b8f2e6; text-decoration: none; font-weight: 500; transition: 0.3s ease; }
    nav a:hover { color: #ffadad; }
    .logo-ab { font-size: 1.3em; font-weight: bold; color: #eaeaea; }

    main { padding: 60px 40px; }
    h1 { font-size: 2.5em; margin-bottom: 10px; color: #fcd5ce; }
    p.subtitle { font-size: 1.2em; color: #ccc; margin-bottom: 10px; }

    /* Grid de álbumes */
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .album {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid #444;
      cursor: pointer;
      transition: transform 0.4s ease;
    }
    .album:hover { transform: scale(1.03); box-shadow: 0 0 12px rgba(255, 173, 173, 0.2); }
    .album:focus-visible { outline: 2px solid #ffadad; outline-offset: 3px; }
    .album img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); transition: filter 0.3s ease; }
    .album:hover img, .album:focus-visible img { filter: brightness(1); }
    .album-title {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #fff;
      font-size: 1.5em;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    }
    .album-grid .album:nth-child(-n+2) { grid-column: span 2; grid-row: span 2; }
    .vacio { color: #ccc; }

    /* Visor */
    .visor {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(10,10,10,0.96);
      z-index: 1000;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .visor.on { opacity: 1; }
    .visor img { max-width: 90vw; max-height: 72vh; object-fit: contain; border-radius: 10px; transition: opacity 0.3s ease; }
    .visor .cap { margin-top: 14px; padding: 0 20px 24px; text-align: center; color: #ccc; font-size: 0.9em; line-height: 1.5; max-width: 700px; }
    .visor .cap strong { display: block; color: #fcd5ce; font-weight: 500; font-size: 1.1em; }
    .visor .cap span { display: block; }
    .visor .cap .pie { color: #b8f2e6; margin-top: 4px; }
    .visor .cerrar { position: fixed; top: 20px; right: 30px; color: #ffc6c6; cursor: pointer; font-size: 1.2em; z-index: 2; }
    .visor .flecha { position: fixed; top: 50%; transform: translateY(-50%); font-size: 2em; color: #ffc6c6; cursor: pointer; user-select: none; padding: 10px; z-index: 2; }
    .visor .izq { left: 10px; }
    .visor .der { right: 10px; }
    .visor .puntos { position: fixed; bottom: 14px; display: flex; gap: 5px; justify-content: center; width: 100%; flex-wrap: wrap; padding: 0 20px; }
    .visor .puntos i { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .visor .puntos i.act { background: #ffc6c6; }
    .visor .aviso { position: fixed; top: 24px; left: 16px; color: #ccc; font-size: 0.8em; opacity: 0.7; }

    .cruz {
      position: fixed;
      font-size: 1.5em;
      color: #ffadad;
      opacity: 0.7;
      animation: flotar 6s ease-in-out infinite;
      z-index: 5;
      pointer-events: none;
    }
    .cruz:nth-child(1) { top: 70px; left: 25px; animation-delay: 0s; }
    .cruz:nth-child(2) { top: 80px; right: 40px; animation-delay: 1s; }
    .cruz:nth-child(3) { bottom: 50px; left: 60px; animation-delay: 2s; }
    .cruz:nth-child(4) { bottom: 40px; right: 50px; animation-delay: 3s; }
    @keyframes flotar { 0%,100%{transform:translateY(0) rotate(0deg);opacity:0.7;} 50%{transform:translateY(-12px) rotate(6deg);opacity:1;} }
    @media (prefers-reduced-motion: reduce) { .cruz { animation: none; } }

    @media (max-width: 768px) {
      nav { flex-wrap: wrap; gap: 10px; padding: 10px 5px; }
      main { padding: 20px 15px; }
      h1 { font-size: 1.8em; margin-bottom: 8px; }
      p.subtitle { font-size: 1em; margin-bottom: 15px; }
      .album-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
      .album img { max-height: 200px; }
      .album-title { font-size: 0.9em; bottom: 8px; left: 8px; }
      .album-grid .album:nth-child(-n+2) { grid-column: span 1; grid-row: span 1; }
    }
  </style>
</head>
<body>

  <div class="cruz">✝︎</div>
  <div class="cruz">✝︎</div>
  <div class="cruz">✝︎</div>
  <div class="cruz">✝︎</div>

  <nav>
    <a class="logo-ab">✝︎ ab</a>
    <a href="index.html" style="color: #ffadad;">visiones</a>
    <a href="music.html">melodías</a>
    <a href="films.html">luces</a>
    <a href="artes.html">artes</a>
    <a href="manifiesto.html">manifiesto</a>
  </nav>

  <main>
    <h1>visiones</h1>
    <p class="subtitle">exploración visual de lo que me rodea.</p>
    <div class="album-grid" id="grilla"></div>
  </main>

  <!-- Los álbumes se agregan en el archivo visiones.js -->
  <script src="visiones.js"></script>
  <script>
    // Más nuevos primero: en el orden del archivo, o por fecha si TODOS tienen "fecha"
    let lista = (typeof visiones !== 'undefined' ? visiones : []).filter(a => a.fotos && a.fotos.length);
    if (lista.length && lista.every(a => a.fecha)) {
      lista = lista.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
    }

    // Ruta de una foto: si es solo el nombre del archivo, se le agrega la carpeta del álbum
    function ruta(a, f) {
      const arch = typeof f === 'string' ? f : f.archivo;
      const carp = a.carpeta ? a.carpeta.replace(/\/?$/, '/') : '';
      return (carp && arch.indexOf('/') === -1) ? carp + arch : arch;
    }

    const grilla = document.getElementById('grilla');
    if (!lista.length) grilla.innerHTML = '<p class="vacio">todavía no hay álbumes...</p>';

    lista.forEach(a => {
      const card = document.createElement('div');
      card.className = 'album';
      card.setAttribute('role', 'button');
      card.tabIndex = 0;
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = a.portada || ruta(a, a.fotos[0]);
      img.alt = a.titulo || 'álbum';
      const t = document.createElement('div');
      t.className = 'album-title';
      t.textContent = a.titulo || '';
      card.append(img, t);
      card.addEventListener('click', () => abrir(a));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(a); }
      });
      grilla.appendChild(card);
    });

    // Visor
    let ov = null, cerrado = true, album = null, idx = 0;
    function mostrar(i) {
      idx = (i + album.fotos.length) % album.fotos.length;
      const f = album.fotos[idx];
      const img = ov.querySelector('img');
      img.style.opacity = 0;
      img.onload = img.onerror = () => { img.style.opacity = 1; };
      img.src = ruta(album, f);
      ov.querySelector('.pie').textContent = (typeof f === 'object' && f.pie) || '';
      [...ov.querySelector('.puntos').children].forEach((d, n) => d.classList.toggle('act', n === idx));
    }
    function cerrar() {
      if (cerrado) return;
      cerrado = true;
      window.removeEventListener('popstate', cerrar);
      const o = ov;
      o.classList.remove('on');
      setTimeout(() => { o.remove(); document.body.style.overflow = ''; }, 300);
    }
    function pedirCierre() {
      if (history.state && history.state.visor) history.back(); else cerrar();
    }
    function abrir(a) {
      album = a;
      cerrado = false;
      document.body.style.overflow = 'hidden';
      ov = document.createElement('div');
      ov.className = 'visor';
      ov.innerHTML = '<div class="cerrar">✝︎ cerrar ✝︎</div><div class="flecha izq">⟵</div><div class="flecha der">⟶</div>' +
        '<img alt=""><div class="cap"><strong></strong><span class="sub"></span><span class="pie"></span></div><div class="puntos"></div>';
      ov.querySelector('strong').textContent = a.titulo || '';
      ov.querySelector('.sub').textContent = a.subtitulo || '';
      ov.querySelector('img').alt = a.titulo || '';
      a.fotos.forEach(() => ov.querySelector('.puntos').appendChild(document.createElement('i')));
      if (window.innerWidth < 768) {
        const av = document.createElement('div');
        av.className = 'aviso';
        av.textContent = '⟷ deslizar para cambiar';
        ov.appendChild(av);
      }
      ov.onclick = e => {
        if (e.target.classList.contains('izq')) mostrar(idx - 1);
        else if (e.target.classList.contains('der')) mostrar(idx + 1);
        else if (e.target.classList.contains('cerrar')) pedirCierre();
      };
      // Deslizar con el dedo (se reinicia en cada toque)
      let x0 = 0, x1 = 0;
      const im = ov.querySelector('img');
      im.addEventListener('touchstart', e => { x0 = x1 = e.touches[0].clientX; });
      im.addEventListener('touchmove', e => { x1 = e.touches[0].clientX; });
      im.addEventListener('touchend', () => {
        const d = x1 - x0;
        if (Math.abs(d) > 50) mostrar(d > 0 ? idx - 1 : idx + 1);
      });
      document.body.appendChild(ov);
      mostrar(0);
      setTimeout(() => ov.classList.add('on'), 20);
      history.pushState({ visor: true }, '');
      window.addEventListener('popstate', cerrar);
    }
    document.addEventListener('keydown', e => {
      if (cerrado) return;
      if (e.key === 'Escape') pedirCierre();
      if (e.key === 'ArrowRight') mostrar(idx + 1);
      if (e.key === 'ArrowLeft') mostrar(idx - 1);
    });
  </script>

</body>
</html>
